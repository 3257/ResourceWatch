name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Standard GitHub-hosted runners are free for public repositories; -large and -xlarge runners are not.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: |
          bash build.sh
          codesign --verify --strict dist/ResourceWatch.app
          test -f dist/ResourceWatch.app/Contents/Resources/Scripts/dev_clean.py
